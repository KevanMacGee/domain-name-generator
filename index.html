<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f3">
  <title>Name Modifier Generator</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f9f3;
      --foreground: #000000;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-foreground: #ffffff;
      --secondary: #14b8a6;
      --secondary-hover: #0d9488;
      --secondary-foreground: #ffffff;
      --muted: #f0f0f0;
      --muted-foreground: #333333;
      --accent: #f59e0b;
      --accent-soft: #fef3c7;
      --accent-foreground: #000000;
      --destructive: #ef4444;
      --border: #000000;
      --input: #737373;
      --ring: #a5b4fc;
      --pink: #ec4899;
      --green: #22c55e;
      --radius: 1rem;
      --font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--foreground);
      background-color: var(--background);
      font-family: var(--font-sans);
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    :focus-visible {
      outline: 4px solid var(--ring);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(100% - 40px, 960px);
      margin: 0 auto;
      padding: 72px 0 88px;
    }

    .intro {
      position: relative;
      width: 100%;
      margin-bottom: 38px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2.65rem, 7vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.98;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted-foreground);
      font-size: clamp(1rem, 2vw, 1.18rem);
      font-weight: 500;
    }

    .panel {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .generator-panel {
      position: relative;
      padding: 28px;
      overflow: hidden;
    }

    .generator-panel::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 92px;
      height: 12px;
      background: linear-gradient(90deg, var(--secondary) 0 50%, var(--accent) 50%);
      border-bottom: 2px solid var(--border);
      border-left: 2px solid var(--border);
      content: "";
    }

    .field-label,
    .section-heading {
      display: block;
      margin-bottom: 9px;
      color: var(--foreground);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
    }

    .text-input {
      width: 100%;
      min-height: 56px;
      padding: 0 18px;
      border: 2px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      color: var(--foreground);
      background: var(--card);
      font-size: 1.08rem;
      font-weight: 600;
      transition: box-shadow 140ms ease, transform 140ms ease;
    }

    .text-input::placeholder {
      color: var(--input);
      font-weight: 500;
    }

    .text-input:focus {
      box-shadow: 4px 4px 0 var(--ring);
      outline: none;
    }

    .button {
      min-height: 56px;
      padding: 0 22px;
      border: 2px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      font-weight: 800;
      white-space: nowrap;
      transition: background-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .button:not(:disabled):hover {
      box-shadow: 4px 4px 0 var(--border);
      transform: translate(-2px, -2px);
    }

    .button:not(:disabled):active {
      box-shadow: 1px 1px 0 var(--border);
      transform: translate(1px, 1px);
    }

    .button-primary {
      color: var(--primary-foreground);
      background: var(--primary);
    }

    .button-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .button-secondary {
      min-height: 46px;
      padding-inline: 18px;
      color: var(--secondary-foreground);
      background: var(--secondary);
    }

    .button-secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }

    .field-note,
    .error-message {
      margin: 8px 0 0;
      font-size: 0.82rem;
    }

    .field-note {
      color: var(--muted-foreground);
    }

    .error-message {
      min-height: 1.2em;
      color: var(--destructive);
      font-weight: 700;
    }

    .results-section {
      margin-top: 48px;
    }

    .section-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .section-heading-row .section-heading {
      margin-bottom: 0;
    }

    .result-count {
      padding: 4px 10px;
      border: 2px solid var(--border);
      border-radius: 999px;
      color: var(--accent-foreground);
      background: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
      min-height: 104px;
      padding: 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--muted);
    }

    .result-name {
      display: flex;
      align-items: center;
      min-height: 50px;
      padding: 9px 14px;
      overflow-wrap: anywhere;
      border: 2px solid var(--border);
      border-radius: calc(var(--radius) - 6px);
      color: var(--foreground);
      background: var(--card);
      font-size: 0.95rem;
      font-weight: 700;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    .result-name:nth-child(5n + 1) {
      background: #e0e7ff;
    }

    .result-name:nth-child(5n + 2) {
      background: #ccfbf1;
    }

    .result-name:nth-child(5n + 3) {
      background: var(--accent-soft);
    }

    .result-name:nth-child(5n + 4) {
      background: #fce7f3;
    }

    .result-name:nth-child(5n) {
      background: #dcfce7;
    }

    .result-name:hover {
      transform: translateY(-2px) rotate(-0.5deg);
    }

    .empty-state {
      grid-column: 1 / -1;
      align-self: center;
      margin: 12px 0;
      color: var(--muted-foreground);
      font-size: 0.92rem;
      text-align: center;
    }

    .bulk-search-section {
      margin-top: 38px;
    }

    .bulk-search-panel {
      padding: 18px;
      background: #ccfbf1;
    }

    .bulk-search-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .bulk-search-header .section-heading {
      margin-bottom: 0;
    }

    .bulk-search-text {
      display: block;
      width: 100%;
      min-height: 94px;
      resize: vertical;
      padding: 15px;
      border: 2px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      color: var(--foreground);
      background: var(--card);
      font-family: var(--font-mono);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .bulk-search-text:focus {
      outline: none;
      box-shadow: 4px 4px 0 var(--ring);
    }

    .copy-status {
      min-height: 1.25em;
      margin: 8px 0 0;
      color: var(--muted-foreground);
      font-size: 0.82rem;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .app-shell {
        width: min(100% - 24px, 960px);
        padding: 42px 0 60px;
      }

      .generator-panel {
        padding: 22px;
      }

      .input-row {
        flex-direction: column;
      }

      .button-primary {
        width: 100%;
      }

      .results-section {
        margin-top: 38px;
      }

      .results-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 12px;
      }

      .bulk-search-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .button-secondary {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="intro">
      <h1>SaaS App Name Generator</h1>
      <p class="subtitle">One word in, twentyone names out that sound like they already have a pitch deck and raised a seed round.</p>
    </header>

    <section class="panel generator-panel">
      <form id="generator-form" novalidate>
        <label class="field-label" for="base-word">Base word</label>
        <div class="input-row">
          <input class="text-input" id="base-word" name="base-word" type="text" placeholder="Type a word here" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="word-note word-error">
          <button class="button button-primary" type="submit">Generate Names</button>
        </div>
        <p class="field-note" id="word-note">Use one word. Leading and trailing spaces are trimmed automatically.</p>
        <p class="error-message" id="word-error" role="alert"></p>
      </form>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading-row">
        <h2 id="results-title" class="section-heading">Generated names</h2>
        <span class="result-count" id="result-count" aria-live="polite">0 names</span>
      </div>
      <div class="results-grid" id="results-grid" aria-live="polite">
        <p class="empty-state">Your generated names will appear here.</p>
      </div>
    </section>

    <section class="bulk-search-section" aria-labelledby="bulk-search-title">
      <div class="bulk-search-header">
        <h2 id="bulk-search-title" class="section-heading">Bulk Search Mode</h2>
        <button class="button button-secondary" id="copy-button" type="button" disabled>Copy All</button>
      </div>
      <div class="panel bulk-search-panel">
        <textarea class="bulk-search-text" id="bulk-search-text" rows="3" readonly aria-label="Generated names for Bulk Search Mode" placeholder="Generated names will be listed here, separated by commas."></textarea>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const modifiers = [
        (word) => `${word.endsWith('e') ? word.slice(0, -1) : word}r`,
        (word) => `${word}ly`,
        (word) => `${word}ify`,
        (word) => `${word}io`,
        (word) => `${word}sy`,
        (word) => `${word}zy`,
        (word) => `${word}zi`,
        (word) => `${word}ster`,
        (word) => `${word}able`,
        (word) => `${word}base`,
        (word) => `${word}box`,
        (word) => `${word}hub`,
        (word) => `${word}stack`,
        (word) => `${word}deck`,
        (word) => `${word}dock`,
        (word) => `${word}nest`,
        (word) => `${word}flow`,
        (word) => `${word}space`,
        (word) => `${word}spot`,
        (word) => `${word}pad`,
        (word) => `${word}folio`
      ];

      const form = document.querySelector('#generator-form');
      const input = document.querySelector('#base-word');
      const error = document.querySelector('#word-error');
      const resultsGrid = document.querySelector('#results-grid');
      const resultCount = document.querySelector('#result-count');
      const bulkSearchText = document.querySelector('#bulk-search-text');
      const copyButton = document.querySelector('#copy-button');
      const copyStatus = document.querySelector('#copy-status');
      let generatedNames = [];
      let copyResetTimer;

      function renderResults(names) {
        resultsGrid.replaceChildren();

        if (names.length === 0) {
          const emptyState = document.createElement('p');
          emptyState.className = 'empty-state';
          emptyState.textContent = 'Your generated names will appear here.';
          resultsGrid.append(emptyState);
        } else {
          names.forEach((name) => {
            const result = document.createElement('div');
            result.className = 'result-name';
            result.textContent = name;
            resultsGrid.append(result);
          });
        }

        resultCount.textContent = `${names.length} ${names.length === 1 ? 'name' : 'names'}`;
        bulkSearchText.value = names.join(', ');
        copyButton.disabled = names.length === 0;
      }

      function generateNames() {
        const word = input.value.trim().toLowerCase();
        input.value = word;
        error.textContent = '';
        copyStatus.textContent = '';

        if (!word) {
          generatedNames = [];
          renderResults(generatedNames);
          return;
        }

        if (/\s/.test(word)) {
          generatedNames = [];
          renderResults(generatedNames);
          error.textContent = 'Please enter one word without spaces.';
          input.focus();
          return;
        }

        generatedNames = [...new Set(modifiers.map((modifier) => modifier(word)))];
        renderResults(generatedNames);
      }

      async function copyAll() {
        const text = bulkSearchText.value;
        if (!text) return;

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            bulkSearchText.focus();
            bulkSearchText.select();
            document.execCommand('copy');
            bulkSearchText.setSelectionRange(0, 0);
          }
          copyButton.textContent = 'Copied';
          copyStatus.textContent = 'Names copied to your clipboard.';
        } catch {
          copyStatus.textContent = 'Select the text above and copy it manually.';
        }

        window.clearTimeout(copyResetTimer);
        copyResetTimer = window.setTimeout(() => {
          copyButton.textContent = 'Copy All';
          copyStatus.textContent = '';
        }, 1800);
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        generateNames();
      });

      copyButton.addEventListener('click', copyAll);
      renderResults(generatedNames);
    })();
  </script>
</body>
</html>
